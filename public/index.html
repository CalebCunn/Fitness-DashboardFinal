<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="apex-theme-color" content="#F3EDE2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Apex Running</title>
    <link rel="icon" type="image/svg+xml" href="/apex-mark.svg" />
    <meta name="description" content="Recovery, training, every run in detail, race predictions and run posters." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="apple-touch-startup-image" href="/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch-1206x2622.png" />
    <meta name="apple-mobile-web-app-title" content="Apex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-variant-numeric: normal; }
      html { height: 100%; }
      html { background: #F3EDE2; overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      body {
        height: 100%;
        background: inherit;
        position: fixed; inset: 0; width: 100%;
        overscroll-behavior: none;
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        color: #0A0B10;
        font-variant-numeric: normal;
      }
      #root { height: 100%; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(16,26,38,.2); border-radius: 4px; }
      button { font-family: inherit; cursor: pointer; font-variant-numeric: normal; }
      input, textarea, select { font-family: inherit; font-variant-numeric: normal; }
      a { text-decoration: none; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      (function(){try{var t=localStorage.getItem('theme');var dark=t==='dark'||((!t||t==='auto')&&window.matchMedia('(prefers-color-scheme: dark)').matches);var g=true;try{var p=JSON.parse(localStorage.getItem('apex-look')||'"apex"');g=p!=='swiss';}catch(e){}var c=dark?(g?'#0F3D2F':'#0C0E17'):(g?'#F3EDE2':'#F5F4F0');document.documentElement.style.background=c;document.documentElement.style.colorScheme=dark?'dark':'light';var m=document.getElementById('apex-theme-color');if(m)m.setAttribute('content',c);}catch(e){}
      ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});})();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
